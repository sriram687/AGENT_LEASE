services:
  # ─── Gateway (MCP server + API) ─────────────────────────────────────────
  - type: web
    name: leash-gateway
    runtime: node
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm --filter @leash/gateway start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: leash-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: leash-redis
          type: redis
          property: connectionString
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GATEWAY_PRIVATE_KEY_HEX
        sync: false
      - key: LEASH_INTERNAL_SECRET
        sync: false

  # ─── Cockpit (Next.js) ──────────────────────────────────────────────────
  - type: web
    name: leash-cockpit
    runtime: node
    buildCommand: pnpm install && pnpm --filter @leash/cockpit build
    startCommand: pnpm --filter @leash/cockpit start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: leash-postgres
          property: connectionString
      - key: NEXTAUTH_SECRET
        sync: false
      - key: LEASH_INTERNAL_SECRET
        sync: false

  # ─── Demo Store ──────────────────────────────────────────────────────────
  - type: web
    name: leash-demo-store
    runtime: node
    buildCommand: pnpm install && pnpm --filter @leash/demo-store build
    startCommand: pnpm --filter @leash/demo-store start
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: LEASH_GATEWAY_URL
        fromService:
          name: leash-gateway
          type: web
          property: host

  # ─── Render Workflows (delivery SLA + reauth timers) ────────────────────
  # Configured separately via Render dashboard or API
  # Long-running workflows: delivery-watch, reauthorize, price-watch

databases:
  - name: leash-postgres
    plan: starter
    databaseName: agent_leash
    user: leash

  - name: leash-redis
    type: redis
    plan: starter
